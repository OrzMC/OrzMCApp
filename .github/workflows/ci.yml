name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  split:
    # 平台分层校验（`docs/app-platform-split.md`）：共用目标里不许出现 AppKit/UIKit。
    # 只读源码，秒级；先跑它，省得两个平台构建白跑。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check platform split + project registration + localization
        run: |
          ./scripts/check-platform-split.sh
          python3 scripts/dev/check-pbxproj.py
          python3 scripts/dev/check-localization.py

  protocol-live:
    # 协议层**真 socket** 联调：假 SLP / RCON 服务端起在本机，跑 LiveProbeSmokeTests。
    # 假字节流单测抓不到 "TCP 分段 / 多字节 VarInt / 超时" 这类真实路径问题
    # （历史上 VarInt 左移溢出就是靠真 socket 才暴露的）。
    runs-on: macos-26
    needs: split
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Live protocol tests (fake SLP + RCON servers)
        run: ./scripts/test-servers/run-live-tests.sh

  intel:
    # **Intel 矩阵编译门禁**（父仓库 `docs/platform-support.md`）：Apple Silicon 上交叉编译 x86_64，
    # 抓「只有 arm64 才能编过」的代码（`#if arch(arm64)`、arm64-only 依赖、写死 ARCHS）。
    # 不跑测试：只为证明 Intel 切片能编。发布包是 Universal，靠的就是这个切片。
    #
    # **PR 上默认不跑**（2026-10-26 成本复盘）：它要装 Rosetta + 交叉编译，约 4 分钟，
    # 但和 `build` 并行、不拖慢 PR 反馈；收益只在"改了架构相关代码"时才体现。
    # 需要时给 PR 打 `intel` label，或直接在 main / 发版前跑。
    if: |
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'intel')
    runs-on: macos-26
    needs: split
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      # 构建插件（swift-openapi-generator / SwiftLint）会以 x86_64 构建并**被 x86_64 执行**，
      # 没有 Rosetta 会报 "Bad CPU type in executable"。runner 有免密 sudo。
      - name: Ensure Rosetta 2
        run: |
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "Rosetta 已安装"
          else
            sudo softwareupdate --install-rosetta --agree-to-license
          fi

      - name: Build for x86_64
        run: |
          xcodebuild build \
            -scheme OrzMC \
            -destination 'platform=macOS,arch=x86_64' \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

  dependency-drift:
    # Independent main-branch probe: the required build below always tests the lockfile.
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    needs: split
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Resolve package dependencies
        # 独立、无缓存的 runner 测试依赖 main 分支，不改变锁定组合门禁。
        run: |
          rm -f OrzMC.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          xcodebuild -resolvePackageDependencies -scheme OrzMC -destination 'platform=macOS'

      - name: Build against current dependency branches
        run: |
          xcodebuild build -scheme OrzMC -destination 'platform=macOS' \
            -skipPackagePluginValidation -skipMacroValidation CODE_SIGNING_ALLOWED=NO

  ui-smoke:
    # 只跑**一小撮**代表性用例（不是整套 29 个、22 分钟）：
    # 远程托管空态 → 页顶添加入口弹表单 → 两家分组渲染 → 控制台渲染。
    # 2026-11-06 计量：整套模拟器 UI 22 分钟，其中每个用例有 ~12 秒是
    # `allowSystemPrompts()` 在模拟器上空等 SpringBoard 弹窗（已改掉）。
    #
    # 历史坑：这里曾经指向 `testProviderAddButtonsAppearBesideHeaders`，
    # 该用例在 #139 被删掉 → xcodebuild 跑 0 个用例仍 `exit 0`，**绿灯但什么都没测**，
    # 还白花 13 分钟（冷构建 9 分钟）。现在由 `run-ios-ui-tests.sh` 断言"实际执行 ≥1 个"。
    runs-on: macos-26
    needs: split
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Select an available iPhone simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/simulators.json")); names=[x["name"] for runtime,devices in d["devices"].items() if "iOS" in runtime for x in devices if x["name"].startswith("iPhone") and x.get("isAvailable")]; assert names, "No available iPhone simulator"; print("SIM_NAME="+names[0])' >> "$GITHUB_ENV"
      # 缓存**只有在路径一致时才有用**：缓存的是 `~/Library/Developer/Xcode/DerivedData` 整棵，
      # 而 UI 脚本默认用 `DerivedData/OrzMC-local-ios`。这里让缓存命中的路径就是它
      # （`build` 的 iOS 格也用同一个目录，见矩阵的 derived_data），才能真的复用已编译产物。
      - name: Restore DerivedData cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: xcode-ios-${{ hashFiles('OrzMC.xcodeproj/project.pbxproj', '**/Package.resolved') }}
          restore-keys: |
            xcode-ios-
      - name: Run remote-hosting UI smoke tests
        env:
          UI_ONLY_TESTING: >-
            OrzMCUITests/RemotePanelsUITests/testRemotePageWithoutAccountsShowsEmptyState
            OrzMCUITests/RemotePanelsUITests/testAddFromEmptyPageOpensProviderForms
            OrzMCUITests/RemotePanelsUITests/testMCSManagerSectionShowsInstancesAndStatus
            OrzMCUITests/RemotePanelsUITests/testCreditPoolServerOpensDetail
        run: |
          export DERIVED_DATA_UI="$HOME/Library/Developer/Xcode/DerivedData/OrzMC-local-ios"
          ./scripts/dev/check.sh --ui

  build:
    # 只用标准 GitHub-hosted runner；勿改 `-large`/`-xlarge`（larger runner，即使 public 也计费）。
    runs-on: macos-26
    needs: split
    strategy:
      fail-fast: false
      matrix:
        include:
          # iOS 以前**从没进过 CI**（只构建 macOS）→ iOS 代码路径可以腐烂很久没人知道。
          - destination: "platform=macOS"
            cache_key: macos
            derived_data: OrzMC-local
          - destination: "generic/platform=iOS Simulator"
            cache_key: ios
            # 与 `ui-smoke` 共用同一份 DerivedData 目录，缓存才能真的命中。
            derived_data: OrzMC-local-ios
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      # 只在 main 落盘（PR 只 restore），避免每轮/每分支新增一份 3GiB。
      # key 包含工程和锁文件；依赖漂移由独立任务检测。
      - name: Restore SwiftPM / DerivedData cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: xcode-${{ matrix.cache_key }}-${{ hashFiles('OrzMC.xcodeproj/project.pbxproj', '**/Package.resolved') }}
          restore-keys: |
            xcode-${{ matrix.cache_key }}-

      - name: Unit tests (SwiftPM + app target)
        # 两套都跑：SwiftPM 包单测（Sources/*）+ 应用层 target `OrzMCTests`
        # （后者以前从没进过 CI，所以悄悄腐烂过）。
        # 只在 macOS 那一格跑：它本身是 macOS destination，iOS 格再跑一遍没有意义。
        # 注意：**不要**在这里调 `scripts/swift-check.sh`——那脚本属于父仓库 OrzMC，
        # 不在本仓库里（第一次就踩了这个坑）。
        if: matrix.cache_key == 'macos'
        run: |
          swift test --disable-automatic-resolution
          xcodebuild test \
            -project OrzMC.xcodeproj \
            -scheme OrzMC \
            -destination 'platform=macOS' \
            -only-testing:OrzMCTests \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build (no signing)
        run: |
          xcodebuild build \
            -scheme OrzMC \
            -destination '${{ matrix.destination }}' \
            -derivedDataPath "$HOME/Library/Developer/Xcode/DerivedData/${{ matrix.derived_data }}" \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Verify dependency locks remain unchanged
        run: git diff --exit-code -- Package.resolved OrzMC.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Save SwiftPM / DerivedData cache
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ steps.cache.outputs.cache-primary-key }}

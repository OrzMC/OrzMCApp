name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  split:
    # 平台分层校验（`docs/app-platform-split.md`）：共用目标里不许出现 AppKit/UIKit。
    # 只读源码，秒级；先跑它，省得两个平台构建白跑。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check platform split + project registration + localization
        run: |
          ./scripts/check-platform-split.sh
          python3 scripts/dev/check-pbxproj.py
          python3 scripts/dev/check-localization.py

  protocol-live:
    # 协议层**真 socket** 联调：假 SLP / RCON 服务端起在本机，跑 LiveProbeSmokeTests。
    # 假字节流单测抓不到 "TCP 分段 / 多字节 VarInt / 超时" 这类真实路径问题
    # （历史上 VarInt 左移溢出就是靠真 socket 才暴露的）。
    runs-on: macos-26
    needs: split
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Live protocol tests (fake SLP + RCON servers)
        run: ./scripts/test-servers/run-live-tests.sh

  build:
    # 只用标准 GitHub-hosted runner；勿改 `-large`/`-xlarge`（larger runner，即使 public 也计费）。
    runs-on: macos-26
    needs: split
    strategy:
      fail-fast: false
      matrix:
        include:
          # iOS 以前**从没进过 CI**（只构建 macOS）→ iOS 代码路径可以腐烂很久没人知道。
          - destination: "platform=macOS"
            cache_key: macos
          - destination: "generic/platform=iOS Simulator"
            cache_key: ios
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      # 只在 main 落盘（PR 只 restore），避免每轮/每分支新增一份 3GiB。
      # key 用工程文件哈希（稳定）；HEAD 重解析导致的依赖变化由 xcodebuild 自己增量重编。
      - name: Restore SwiftPM / DerivedData cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: xcode-${{ matrix.cache_key }}-${{ hashFiles('OrzMC.xcodeproj/project.pbxproj') }}
          restore-keys: |
            xcode-${{ matrix.cache_key }}-

      - name: Resolve package dependencies
        # HEAD 制：删除锁文件以强制解析到分支最新（不锁旧 revision）。
        # 坑：共享仓库缓存（org.swift.swiftpm/repositories）里的**分支 ref** 可能落后于上游，
        # 删除 Package.resolved 也没用——解析会用缓存里的旧 main。先显式刷新分支依赖
        # （OrzMCKit main），否则 CI 会把源码回退到旧 revision（实测过）。
        run: |
          rm -f OrzMC.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          for repo in "$HOME"/Library/Caches/org.swift.swiftpm/repositories/OrzMCKit-*; do
            [ -d "$repo" ] || continue
            git -C "$repo" fetch --prune origin '+refs/heads/*:refs/heads/*' || true
          done
          # 缓存里的 SourcePackages 解析状态/checkout 也钉着旧 revision，清掉让 Xcode 重新取
          rm -rf "$HOME"/Library/Developer/Xcode/DerivedData/*/SourcePackages/checkouts/OrzMCKit
          rm -f "$HOME"/Library/Developer/Xcode/DerivedData/*/SourcePackages/workspace-state.json
          # Clang 模块缓存不能跟着 DerivedData 缓存走：runner 镜像升级 SDK 后 mtime 变了，
          # 复用旧 .pcm 会报 "has been modified since the module file … was built" 直接构建失败。
          # 重新编译模块只要几秒，比修缓存 key 稳。
          rm -rf "$HOME"/Library/Developer/Xcode/DerivedData/ModuleCache.noindex
          xcodebuild -resolvePackageDependencies -scheme OrzMC -destination '${{ matrix.destination }}'

      - name: Unit tests (SwiftPM + app target)
        # 两套都跑：SwiftPM 包单测（Sources/*）+ 应用层 target `OrzMCTests`
        # （后者以前从没进过 CI，所以悄悄腐烂过）。
        # 只在 macOS 那一格跑：它本身是 macOS destination，iOS 格再跑一遍没有意义。
        # 注意：**不要**在这里调 `scripts/swift-check.sh`——那脚本属于父仓库 OrzMC，
        # 不在本仓库里（第一次就踩了这个坑）。
        if: matrix.cache_key == 'macos'
        run: |
          swift test
          xcodebuild test \
            -project OrzMC.xcodeproj \
            -scheme OrzMC \
            -destination 'platform=macOS' \
            -only-testing:OrzMCTests \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build (no signing)
        run: |
          xcodebuild build \
            -scheme OrzMC \
            -destination '${{ matrix.destination }}' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Save SwiftPM / DerivedData cache
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ steps.cache.outputs.cache-primary-key }}

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      # 只在 main 落盘（PR 只 restore），避免每轮/每分支新增一份 3GiB。
      # key 用工程文件哈希（稳定）；HEAD 重解析导致的依赖变化由 xcodebuild 自己增量重编。
      - name: Restore SwiftPM / DerivedData cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: xcode-${{ runner.os }}-${{ hashFiles('OrzMC.xcodeproj/project.pbxproj') }}
          restore-keys: |
            xcode-${{ runner.os }}-

      - name: Resolve package dependencies
        # HEAD 制：删除锁文件以强制解析到分支最新（不锁旧 revision）。
        run: |
          rm -f OrzMC.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          xcodebuild -resolvePackageDependencies -scheme OrzMC

      - name: Build (no signing)
        run: |
          xcodebuild build \
            -scheme OrzMC \
            -destination 'platform=macOS' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Save SwiftPM / DerivedData cache
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ steps.cache.outputs.cache-primary-key }}
